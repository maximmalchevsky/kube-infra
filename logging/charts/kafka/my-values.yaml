kafka:
  global:
    defaultStorageClass: "nfs-сlient"

  nameOverride: "kafka"
  fullnameOverride: "kafka"

  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
    tag: 4.0.0-debian-12-r10
    pullPolicy: IfNotPresent
    debug: false

  heapOpts: -Xmx1024m -Xms1024m

  # без этого fluent-bit с обычным kafka-output просто не сможет подключиться —
  # дефолт в новом чарте SASL_PLAINTEXT, в старом молчаливо был PLAINTEXT
  listeners:
    client:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
    external:
      protocol: PLAINTEXT

  controller:
    replicaCount: 2   # см. примечание про кворум ниже — лучше 3
    controllerOnly: false   # combined controller+broker, как было в старом плоском конфиге

    config:
      delete.topic.enable: true
      auto.create.topics.enable: false
      log.flush.interval.messages: 10000
      log.flush.interval.ms: 1000
      log.retention.bytes: 1073741824
      log.retention.check.interval.ms: 300000
      log.retention.hours: 6
      log.segment.bytes: 1073741824
      message.max.bytes: 1000012
      default.replication.factor: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      num.io.threads: 8
      num.network.threads: 3
      num.partitions: 2
      num.recovery.threads.per.data.dir: 1
      socket.receive.buffer.bytes: 102400
      socket.request.max.bytes: 104857600
      socket.send.buffer.bytes: 102400
      allow.everyone.if.no.acl.found: true
      super.users: User:admin

    livenessProbe:
      enabled: true
      initialDelaySeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
      periodSeconds: 10
      successThreshold: 1
    readinessProbe:
      enabled: true
      initialDelaySeconds: 5
      failureThreshold: 6
      timeoutSeconds: 5
      periodSeconds: 10
      successThreshold: 1
    startupProbe:
      enabled: false

    resources:
      requests:
        memory: 1024Mi
        cpu: 500m

    podSecurityContext:
      enabled: true
      fsGroup: 1001
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
      runAsNonRoot: true

    podAntiAffinityPreset: hard   # эквивалент вашего requiredDuringScheduling из старого affinity-блока
    podManagementPolicy: Parallel

    persistence:
      enabled: true
      storageClass: "nfs-client"
      accessModes:
        - ReadWriteOnce
      size: 8Gi

  defaultInitContainers:
    volumePermissions:
      enabled: true   # эквивалент старого корневого volumePermissions.enabled: true
      image:
        registry: docker.io
        repository: bitnamilegacy/os-shell
        tag: 12-debian-12-r51

  service:
    type: NodePort
    ports:
      client: 9092
      interbroker: 9094
    nodePorts:
      client: "32092"
      external: ""
    sessionAffinity: None
    externalTrafficPolicy: Cluster

  metrics:
    jmx:
      enabled: true
      service:
        ports:
          metrics: 5556
      image:
        registry: docker.io
        repository: bitnamilegacy/jmx-exporter
        tag: 1.4.0-debian-12-r0