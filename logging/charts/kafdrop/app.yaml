apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafdrop
  namespace: logging
  labels:
    app: kafdrop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafdrop
  template:
    metadata:
      labels:
        app: kafdrop
    spec:
      containers:
        - name: kafdrop
          image: obsidiandynamics/kafdrop:latest
          ports:
            - name: http
              containerPort: 9000
          env:
            - name: KAFKA_BROKERCONNECT
              value: "kafka:9092"
            - name: JVM_OPTS
              value: "-Xms64M -Xmx256M"
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: kafdrop
  namespace: logging
  labels:
    app: kafdrop
spec:
  type: ClusterIP
  selector:
    app: kafdrop
  ports:
    - name: http
      port: 9000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kafdrop
  namespace: logging
  annotations:
    cert-manager.io/cluster-issuer: dev-ca-issuer
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - kafdrop.maxim.local
      secretName: kafdrop-tls
  rules:
    - host: kafdrop.maxim.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kafdrop
                port:
                  number: 9000