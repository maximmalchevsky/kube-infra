---
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: false
metadata:
  labels:
    helm.sh/chart: grafana-12.8.0
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/version: "13.1.1"
  name: monitoring-grafana
---
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/version: "13.1.1"
    app.kubernetes.io/component: admin-secret
type: Opaque
stringData:
  admin-user: <path:secret/data/monitoring/grafana#admin-user>
  admin-password: <path:secret/data/monitoring/grafana#admin-password>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-grafana
  
  labels:
    helm.sh/chart: grafana-12.8.0
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/version: "13.1.1"
data:
  grafana.ini: |
    [analytics]
    check_for_updates = true
    [log]
    mode = console
    [paths]
    data = /var/lib/grafana/
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    [server]
    domain = grafana.maxim.local
    [unified_storage]
    index_path = /var/lib/grafana-search/bleve
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - access: proxy
      isDefault: true
      name: Victoria
      type: prometheus
      url: http://victoriametrics-victoria-metrics-single-server:8428
  dashboardproviders.yaml: |
    apiVersion: 1

    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: monitoring-grafana
  labels:
    helm.sh/chart: grafana-12.8.0
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: monitoring
    app.kubernetes.io/version: "13.1.1"
  finalizers:
    - kubernetes.io/pvc-protection
spec:
  accessModes:
    - "ReadWriteOnce"
  resources:
    requests:
      storage: "2Gi"
  storageClassName: nfs-client

