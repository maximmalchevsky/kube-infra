victoria-metrics-agent:
  replicaCount: 1
  image:
    repository: victoriametrics/vmagent
    tag: "v1.148.0"
    pullPolicy: IfNotPresent
  annotations:
    reloader.stakater.com/auto: "true"
  nameOverride: "vmagent-sys"
  fullnameOverride: "vmagent-sys"

  # Это параметр зависит от установки victoriametrics
  remoteWrite:
    - url: http://victoriametrics-victoria-metrics-single-server:8428/api/v1/write

  service:
    enabled: true
    servicePort: 8429
    type: ClusterIP
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: dev-ca-issuer

    extraLabels: { }
    hosts:
      - name: vmagent.maxim.local
        path: /
        port: http
    tls:
      - secretName: "vmagent-tls"
        hosts:
          - vmagent.maxim.local
    pathType: Prefix
    ingressClassName: traefik

  resources:
    requests:
      cpu: 200m
      memory: 200Mi
    limits:
      cpu: 500m
      memory: 600Mi

  persistence:
    enabled: true
    storageClassName: nfs-client
    accessModes:
      - ReadWriteOnce
    size: 2Gi

  config:
    global:
      scrape_interval: 10s

  extraScrapeConfigs:
    - job_name: 'node-exporter'
      kubernetes_sd_configs:
        - role: endpoints
      relabel_configs:
        - source_labels: [ __meta_kubernetes_endpoints_name ]
          regex: 'node-exporter-prometheus-node-exporter'
          action: keep
    - job_name: 'kube-state-metrics'
      static_configs:
        - targets: [ 'kube-state-metrics:8080' ]
    - job_name: argocd-server
      static_configs:
        - targets:
            - argocd-server-metrics.argocd.svc.cluster.local:8083

    - job_name: argocd-repo-server
      static_configs:
        - targets:
            - argocd-repo-server-metrics.argocd.svc.cluster.local:8084

    - job_name: argocd-application-controller
      static_configs:
        - targets:
            - argocd-application-controller-metrics.argocd.svc.cluster.local:8082

    - job_name: argocd-applicationset-controller
      static_configs:
        - targets:
            - argocd-applicationset-controller-metrics.argocd.svc.cluster.local:8080
